name: dsh-sync

# DSH（DeepSeek Harness 飞牛版）同步：
# - 每日定时检查本源（FFFFFFFFNNN）自建的 dsh-<版本> Release 是否有更新，
#   有新版本才同步索引并更新 fnpack.json / README.md
# - 同步后把最新版 fpk 镜像到本源 Release（tag: dsh-<版本>），
#   让 DSH 和 1panel 一样显示在本仓库 Releases，下载不再依赖上游仓库
# - 手动触发可用 force=1 执行一次性迁移（下线旧 DeepSeek Harness 自建链路）
on:
  schedule:
    # 每小时 40 分兜底同步一次索引（构建工作流自身已即时同步，这里只是保险）
    - cron: "40 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: 'force=1 时先执行迁移（清理旧应用后重建索引）'
        required: false
        default: ''
      mirror:
        description: "mirror=all 时把索引里的全部历史版本都镜像到本源 Release（首次全量补档用）"
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 迁移（仅 force=1 时执行）
        if: github.event.inputs.force == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: node scripts/migrate-dsh.mjs

      - name: 同步上游 Release 并镜像到本源 Release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          node scripts/sync-dsh.mjs
          MIRROR_ARGS=""
          if [ "${{ github.event.inputs.mirror }}" = "all" ]; then MIRROR_ARGS="--all"; fi
          node scripts/mirror-dsh.mjs $MIRROR_ARGS
          # 镜像成功后删掉本源里的旧版 Release（只保留最新版），并清理索引里指向它们的
          # 下载条目。--all 是回填历史版本，那种情况不能清理，否则刚回填的又被删掉。
          if [ -z "$MIRROR_ARGS" ]; then
            node scripts/prune-releases.mjs --slug dsh
          else
            echo "mirror=all（回填模式），跳过旧版本清理"
          fi
          node scripts/update-index.mjs

      - name: 提交并推送
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MIRROR: ${{ github.event.inputs.mirror }}
        run: |
          set -euo pipefail
          VERSION=""
          if [ -f build/dsh/meta.json ]; then VERSION=$(node -p "require('./build/dsh/meta.json').version"); fi
          # 索引文件都是脚本生成的：并发冲突时以最新远端为基准重新生成再推，
          # 不再用 pull --rebase（冲突会把 HEAD 留在 detached，push 直接 fatal）
          bash scripts/push-index.sh \
            --message "chore: sync DSH ${VERSION}" \
            --regen 'node scripts/sync-dsh.mjs; MIRROR_ARGS=""; if [ "${MIRROR:-}" = "all" ]; then MIRROR_ARGS="--all"; fi; node scripts/mirror-dsh.mjs ${MIRROR_ARGS}; if [ -z "${MIRROR_ARGS}" ]; then node scripts/prune-releases.mjs --slug dsh; fi; node scripts/update-index.mjs'
