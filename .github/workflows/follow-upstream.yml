name: follow-upstream

# 每天自动跟随官方源，自动打包 fnOS FPK 并发布：
# - 1Panel 面板本体（原生双架构，官方 CDN v2）
# - 应用市场名单（Docker 型，1Panel appstore）
on:
  schedule:
    # 每小时 05 分检查一次上游 1Panel 是否有新版本；有新版才构建，同步与索引更新走指纹判断，无变化不提交
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    outputs:
      pending: ${{ steps.dump.outputs.pending }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Sync all upstreams
        run: |
          node scripts/sync-1panel.mjs --repo ${{ github.repository }}
          node scripts/update-index.mjs --repo ${{ github.repository }}

      - name: Validate fnpack skeleton
        run: |
          node -e "
          const j=require('./fnpack.json');
          if(j.schema_version!=='2') throw new Error('schema_version must be 2');
          if(!j.source_info?.name||!j.source_info?.author) throw new Error('source_info incomplete');
          if(typeof j.apps!=='object') throw new Error('apps must be object');
          console.log('apps indexed:',Object.keys(j.apps).join(', '));
          "

      - id: dump
        name: Dump pending + upload
        run: |
          echo "pending=$(node -e "console.log(require('./pending.json').map(e=>e.slug+':'+e.version).join(','))")" >> "$GITHUB_OUTPUT"
          cat pending.json || true
      - uses: actions/upload-artifact@v4
        with:
          name: sync-state
          path: |
            pending.json
            build/1panel/meta.json
            fnpack.json
            apps/
            assets/
            README.md

  build-x86:
    needs: sync
    if: needs.sync.outputs.pending != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 关键：sync 任务的产物（pending.json / build/1panel/meta.json / apps/ …）
      # 只存在于 sync-state 工件里，构建任务必须先恢复，否则 pending.json 缺失、
      # 版本号也是 checkout 里的旧值。
      - name: 恢复 sync 产物
        uses: actions/download-artifact@v4
        with:
          name: sync-state
          path: .
      - name: Build FPKs (x86)
        run: |
          chmod +x scripts/build-1panel.sh scripts/build-fpk.sh
          mkdir -p dist
          for slug in $(node -e "console.log(require('./pending.json').map(e=>e.slug).join(' '))"); do
            case "$slug" in
              1panel) ./scripts/build-1panel.sh dist ;;
              *) ./scripts/build-fpk.sh "$slug" dist || true ;;
            esac
          done
          # build-1panel.sh 会同时产出双架构，这里只保留 x86，arm 由 build-arm 提供，
          # 避免两个工件同名互相覆盖
          rm -f dist/1panel_*_arm.fpk dist/1panel-arm.fpk-info.json
          ls -la dist/

      - uses: actions/upload-artifact@v4
        with:
          name: fpk-x86
          path: dist/*

  build-arm:
    needs: sync
    if: needs.sync.outputs.pending != ''
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 恢复 sync 产物
        uses: actions/download-artifact@v4
        with:
          name: sync-state
          path: .
      - name: Build FPKs (arm)
        run: |
          chmod +x scripts/build-1panel.sh scripts/build-fpk.sh
          mkdir -p dist-arm
          for slug in $(node -e "console.log(require('./pending.json').map(e=>e.slug).join(' '))"); do
            case "$slug" in
              1panel)
                # 1panel arm tarball is downloaded upstream; the script builds both arches,
                # so only keep the arm outputs here to avoid clobbering x86 artifacts.
                ./scripts/build-1panel.sh dist-arm
                rm -f dist-arm/1panel_*_x86.fpk dist-arm/1panel-x86.fpk-info.json
                ;;
              *) echo "skip docker $slug on arm runner (built on x86)" ;;
            esac
          done
          ls -la dist-arm/ || true

      - uses: actions/upload-artifact@v4
        with:
          name: fpk-arm
          path: dist-arm/*

  release:
    needs: [sync, build-x86, build-arm]
    if: needs.sync.outputs.pending != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: fpk-x86
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: fpk-arm
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: sync-state
          path: .
      - name: Finalize details + 发布新版 + 清理旧 Release + 提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for slug in $(node -e "console.log(require('./pending.json').map(e=>e.slug).join(' '))"); do
            VER=$(node -e "console.log(require('./pending.json').find(e=>e.slug==='$slug').version)")
            NAME=$(node -e "const m=require('./build/$slug/meta.json');console.log(m.displayName||'$slug')")
            # tag 用 slug（与历史 tag `1panel-2.2.5-1` 一致），标题用 displayName
            TAG="${slug}-${VER}"
            # finalize 失败必须让任务失败：否则新 meta 会被提交、但 apps/<slug>.json 里没有
            # 这次发布，而下次 sync 因为指纹已变不再产生 pending，索引就永远缺这一版。
            case "$slug" in
              1panel) node scripts/finalize-1panel.mjs --repo ${{ github.repository }} --tag "$TAG" --dist dist ;;
              *) node scripts/finalize.mjs --repo ${{ github.repository }} --tag "$TAG" --dist dist ;;
            esac
            node scripts/update-index.mjs --repo ${{ github.repository }} || true
            # 先把新版本发出去，成功了再删旧版本：顺序反过来的话，一旦发布失败旧版本已经没了，
            # 用户会一个能装的包都不剩。只发 .fpk（不要把 fpk-info.json 也当资产传上去）；
            # tag 已存在时改为覆盖上传，避免“Release 建了但索引没提交”的情况下卡死重试。
            # 更新内容取自上游该版本的 Release 正文（finalize 已写入 apps/<slug>.json）
            NOTE=$(node -e "
              const fs=require('fs');
              const p='./apps/$slug.json';
              const d=fs.existsSync(p)?JSON.parse(fs.readFileSync(p,'utf8')):{};
              const r=(d.releases||{})['$VER']||{};
              process.stdout.write(r.changelog||r.release_note||'');
            ")
            [ -n "$NOTE" ] || NOTE="（上游未提供该版本的更新说明）"
            # 用 printf 拼接多行说明，避免在 YAML 块标量里出现顶格行
            NOTES=$(printf '%s\n\n## 更新内容（同步自上游）\n\n%s' \
              "自动跟随官方源打包更新：$NAME $VER。由本源 GitHub Actions 生成。" \
              "$NOTE")
            gh release create "$TAG" dist/${slug}*.fpk \
              --title "$NAME $VER" \
              --notes "$NOTES" \
              || gh release upload "$TAG" dist/${slug}*.fpk --clobber
            # 同一应用只保留最新版 Release（--keep-tag 双保险，绝不删掉刚发的这个），
            # 同时清理 apps/<slug>.json 里指向已删除 Release 的下载条目。
            node scripts/prune-releases.mjs --slug "$slug" --keep-tag "$TAG"
            git add fnpack.json apps/ assets/ build/ shared/ scripts/ README.md LICENSE
            git commit -m "chore: follow ${NAME} ${VER}" || true
            git push
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
